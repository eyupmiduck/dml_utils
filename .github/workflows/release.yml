name: Release

# Publishes a tagged commit to GitHub Packages and opens the matching GitHub
# Release. The reusable workflow derives -Drevision from the tag, so the tag is
# the single source of truth for the version: bump <revision> in the POM only
# for local/snapshot builds, a release never edits it.
on:
  push:
    tags:
      # A digit must follow the "v", so a bare "v" or a typo like "vfoo"
      # cannot trigger a release.
      - "v[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library. Keep it in step with the scripts/ submodule.
    permissions:
      contents: write
      packages: write
    uses: eyupmiduck/workflow_library/.github/workflows/maven-release.yml@593fcd4bd1fe5a5cb9921360d7365747fc249b62
    with:
      java-version: "25"
      postgres-version: postgres:17-alpine
      project: dml_utils
