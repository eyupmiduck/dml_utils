# Accepted plpgsql_check findings.
#
# PlpgsqlCheckTest runs plpgsql_check_function_tb(..., all_warnings => true)
# over every routine in dml_utils / dml_utils_lib / dml_utils_data and matches each finding
# against one of these entries (field by field; omit a field to match any
# value). A finding with no match fails the test, and an entry that matches no
# finding is reported as stale and also fails.
- schema: dml_utils_lib
  function: process_migration_chunk
  level: security
  statement: EXECUTE
  message: text type variable is not sanitized
  reason: >-
    The routine executes the fully-formed chunk SQL built by
    dml_utils_lib.render_chunk_sql from validated identifiers (%I) and typed
    ids, and is SECURITY INVOKER, so a caller already holds the privileges the
    SQL would use. The dynamic SQL is deliberate; see process_migration_chunk.sql.
