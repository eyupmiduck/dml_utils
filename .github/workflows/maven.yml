name: Maven Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: maven-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` lets the reusable Maven workflow's GITHUB_TOKEN fetch the
# liquibase-validation artifact from GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  build:
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library. Keep it in step with the scripts/ submodule.
    uses: eyupmiduck/workflow_library/.github/workflows/maven.yml@593fcd4bd1fe5a5cb9921360d7365747fc249b62
    with:
      java-version: "25"
      postgres-versions: '["postgres:16-alpine","postgres:17-alpine","postgres:18-alpine"]'
      project: dml_utils
      maven-command: ./mvnw --batch-mode clean verify
