# Keep Maven dependencies and GitHub Actions current.
#
# Minor and patch updates are grouped into a single PR per ecosystem to reduce
# noise; major updates arrive as individual PRs so they get a real review.
# Note: Testcontainers and jOOQ are deliberate, so a dependency bump there is a
# change to validate, not to merge blindly. The Maven build and integration tests
# run on every Dependabot PR, so a broken update fails CI before it can reach
# main.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    reviewers:
      - eyupmiduck
    commit-message:
      prefix: deps
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        # Keep the deliberately pinned artifacts out of the bulk group so their
        # updates are reviewed on their own.
        exclude-patterns:
          - "org.testcontainers:*"
          - "org.jooq:*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    reviewers:
      - eyupmiduck
    commit-message:
      prefix: deps
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
