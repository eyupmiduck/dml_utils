name: Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# The pinned reusable workflow only reads the repository (gitleaks scans the git
# history) and never uploads SARIF or comments on PRs, so contents: read is the
# minimum it needs; a reusable workflow's scopes are capped by this caller.
permissions:
  contents: read

# Pull-request runs share a per-PR group so a newer run cancels a stale one.
# Push and manual runs are keyed by commit SHA and never cancelled, so every
# commit on main gets a completed scan.
concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library.
    uses: eyupmiduck/workflow_library/.github/workflows/secret-scan.yml@83d3de534b94b63f7876709f2e969621136caaf8
