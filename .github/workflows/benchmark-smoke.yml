name: Benchmark smoke

# The benchmark is not covered by the Maven build: it drives the routines
# through the benchmark fixtures, which live outside the Liquibase-managed
# schemas and are owned by the container superuser. This smoke test creates a
# tiny isolated benchmark database, runs one measured run per chunking strategy,
# and removes it again, so a changelog or benchmark change cannot silently break
# the harness (for example the boundary scan losing access to the fixture schema).
#
# It runs only when the benchmark, a changelog or the build files change, so the
# extra custom-image build does not run on unrelated pull requests.

on:
  pull_request:
    paths:
      - "benchmark/**"
      - "dml_utils/src/main/resources/db/changelog/**"
      - "pom.xml"
      - "dml_utils/pom.xml"
      - "scripts"
      - "scripts/**"
      - ".github/workflows/benchmark-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "benchmark/**"
      - "dml_utils/src/main/resources/db/changelog/**"
      - "pom.xml"
      - "dml_utils/pom.xml"
      - "scripts"
      - "scripts/**"
      - ".github/workflows/benchmark-smoke.yml"
  workflow_dispatch:

concurrency:
  group: benchmark-smoke-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` lets Maven fetch the liquibase-validation and ddl_utils
# artifacts from GitHub Packages when setup.sh unpacks the ddl_utils changelog.
permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The custom image build lives in the workflow_library submodule
          # mounted at scripts/.
          submodules: true

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # Writes the ~/.m2/settings.xml server entry `github`; the values are
          # environment variable names, so GITHUB_TOKEN must be exported to the
          # Maven steps.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build custom PostgreSQL image
        env:
          PROJECT: dml_utils
        run: scripts/build-postgres-image.sh postgres:17-alpine

      - name: Unpack the ddl_utils changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./mvnw --batch-mode --no-transfer-progress -q -pl dml_utils -am initialize

      - name: Run the benchmark smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: benchmark/smoke.sh
