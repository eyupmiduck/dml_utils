name: Release

# Publishes a tagged commit to GitHub Packages and opens the matching GitHub
# Release. The reusable workflow derives -Drevision from the tag, so the tag is
# the single source of truth for the release version; the POM's <revision> is
# kept current afterwards by an automated follow-up PR (bump-snapshot), not by
# the release itself.
on:
  push:
    tags:
      # Narrow the glob as far as GitHub allows; validate-tag below enforces the
      # exact vX.Y.Z shape (a glob still lets "v1foo" or "v1.2.3.4" through).
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require vX.Y.Z
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag '$tag' is not vX.Y.Z"
            exit 1
          fi

  release:
    needs: validate-tag
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library. Keep it in step with the scripts/ submodule.
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: eyupmiduck/workflow_library/.github/workflows/maven-release.yml@16adb4400f7e82020f791cc367775819220ebb60
    with:
      java-version: "25"
      postgres-version: postgres:17-alpine
      project: dml_utils
      # The reusable workflows' setup-java only writes the `github` server;
      # this file adds the second `github-ddl-utils` server. The release script
      # retries the known jOOQ-codegen/PostgreSQL startup race and defers
      # deployment until the reactor builds; see maven-release-retry.sh.
      maven-command: ./.github/scripts/maven-release-retry.sh
      # After the release, open a PR bumping the POM's <revision> to the next
      # patch snapshot. The PR is opened with RELEASE_TOKEN (a PAT/App token),
      # because GITHUB_TOKEN-opened PRs do not trigger the required checks.
      bump-snapshot: true
    secrets:
      release-token: ${{ secrets.RELEASE_TOKEN }}
