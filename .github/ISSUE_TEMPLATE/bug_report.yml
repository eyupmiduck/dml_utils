name: Bug report
description: Report something that is broken or behaving unexpectedly in dml_utils.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve dml_utils. Please fill in as much detail as you can.

        If this is a security issue, do **not** open a public issue — see
        [SECURITY.md](https://github.com/eyupmiduck/dml_utils/blob/main/SECURITY.md)
        for private reporting.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and could not find this bug.
          required: true
        - label: I am running a supported PostgreSQL version (16, 17, or 18).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include changelog files or SQL where relevant.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: postgres-version
    attributes:
      label: PostgreSQL version
      options:
        - "16"
        - "17"
        - "18"
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dml_utils version or commit
      placeholder: e.g. main @ 1c1c0b9, or 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, JDK, and Docker version.
      placeholder: |
        OS: Ubuntu 24.04
        JDK: Temurin 25
        Docker: 29.x
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Maven, Liquibase, or stack trace output.
      render: shell
